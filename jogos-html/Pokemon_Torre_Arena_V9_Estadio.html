.gymHero{border-radius:0;background:radial-gradient(circle at 83% 16%,#cc9e4970,transparent 34%),linear-gradient(125deg,#416887,#182b43)}
.moncard{background:linear-gradient(#1f3b54,#0e1d31)}
.sprite{image-rendering:pixelated;filter:drop-shadow(0 3px 0 #060d1666)}
.modalBackdrop:has(.combatModal){padding:0;background:#07101df5;backdrop-filter:none;align-items:center}
.modal.combatModal{width:min(100vw,1160px);max-height:100dvh;height:auto;padding:8px 10px 10px;border:0;border-radius:16px;background:linear-gradient(170deg,#1d2837,#0e1929);overflow:auto;box-shadow:0 0 70px #000c;}
.battleHeading{margin:0 0 7px!important;min-height:35px;display:flex;align-items:center;justify-content:space-between;gap:7px}.battleHeading h2{font-family:system-ui,sans-serif;font-size:17px;line-height:1.15;letter-spacing:.01em;text-transform:uppercase;margin:3px 0}.battleHeading .overline{font-size:9px;letter-spacing:.09em;color:#d5be76}.liveFlag{font-size:9px!important;white-space:nowrap;color:#bde6d9!important}
.arenaPro{width:100%;height:auto!important;aspect-ratio:640/400!important;max-height:min(61dvh,630px);border-radius:5px!important;border:3px solid #b0a68c!important;box-shadow:0 4px 0 #474847,0 10px 30px #020916!important;background:#213d40!important;overflow:hidden}
.arenaPro canvas{image-rendering:pixelated;}
.arenaTint{pointer-events:none;opacity:0!important}
.hudPro{top:6px!important;width:min(40%,246px)!important;padding:7px 9px!important;background:linear-gradient(175deg,#233c4cf5,#132737f4)!important;border:2px solid #bac6ba!important;border-radius:7px!important;box-shadow:0 3px 0 #0008!important}
.hudPro.ally{left:6px!important;right:auto!important}.hudPro.enemy{right:6px!important;left:auto!important}
.hudName{font-size:12px!important;color:#fff4d8!important}.hudName em{font-size:10px!important;color:#bddde5!important}
.hudTrack{height:9px!important;border-radius:3px!important;border:1px solid #7d9e8c!important;background:#061720!important}
.hudNumbers{font-size:10px!important;letter-spacing:.02em}
.arenaChip{top:63px!important;left:8px!important;right:auto!important;background:#0f2336cf!important;border:1px solid #a2b5b2!important;border-radius:4px!important;font-size:9px!important;padding:3px 5px!important}
.crosshairHelp{font-size:8px!important;bottom:6px!important;color:#e9f8df!important;text-shadow:0 1px 2px #000}
.joyZone{bottom:10px!important;left:10px!important;transform:scale(.86);transform-origin:bottom left}.joyBase{border-color:#d1e0cf!important;background:#1a303eab!important}.joyKnob{background:#dbeacf!important}
.dodgeBtn{bottom:12px!important;right:13px!important;background:linear-gradient(145deg,#e8c67c,#b37b36)!important;border:3px solid #ffe5ad!important;color:#30240b!important;box-shadow:0 5px 0 #5e381e!important}
.battleFooter{padding:7px 3px 0!important;background:transparent!important}
.energyHud{margin:5px 2px 7px!important;font-size:11px!important;color:#e9dcc5!important}
.energyTrack{background:#071723!important}.energyTrack i{background:linear-gradient(90deg,#65c8fa,#b7edff)!important}
.skillgridV8{gap:7px!important;grid-template-columns:repeat(2,minmax(0,1fr))!important}
.skillV8{min-height:61px!important;border:2px solid #8195a9!important;border-bottom:4px solid var(--skillColor)!important;border-radius:7px!important;padding:8px!important;background:linear-gradient(130deg,#263e57,#152437)!important;box-shadow:inset 0 2px 0 #ffffff13,0 3px 0 #061220!important;touch-action:manipulation}
