function showSwap(){if(!battle?.active)return;const b=battle;const root=$('combatContainer');root.innerHTML=`<div class="notice">Escolha outro Pokémon da sua equipe. Cada troca consome um pouco da energia de batalha.</div><div class="swapgrid" style="margin-top:12px">${save.team.map((m,i)=>`<button data-swap="${i}" class="${i===b.pIndex?'active':''}" ${m.hp<=0||i===b.pIndex?'disabled':''}>${img(m.id)}<b>${D[m.id].name}</b><small>Nv. ${m.level} · ${m.hp}/${m.maxHp} PV</small></button>`).join('')}</div><button class="btn ghost wide" id="cancelSwap" style="margin-top:12px">VOLTAR AOS GOLPES</button>`;document.querySelectorAll('[data-swap]').forEach(el=>el.onclick=()=>{b.pIndex=+el.dataset.swap;b.energy=Math.max(0,b.energy-10);cooldowns=[0,0,0,0];log(`Vai, ${D[current().id].name}!`);renderBattle()});$('cancelSwap').onclick=renderBattle;}
function catchMon(){if(!battle?.active||!battle.wild||!save.balls)return;save.balls--;let m=foe(),chance=.28+.64*(1-m.hp/m.maxHp);if(Math.random()<chance){battle.active=false;stopTimers();const caught=mon(m.id,m.level);if(save.team.length<6)save.team.push(caught);else save.box.push(caught);persist();resultScreen(`🔴 ${D[m.id].name} capturado!`,`Novo Pokémon básico no nível ${m.level}! ${save.team.length<=6?'Você pode organizar sua equipe.':'Foi enviado à caixa.'}`,false,true)}else{log('O Pokémon escapou da Pokébola! Tente enfraquecê-lo mais.');persist();renderBattle();scheduleEnemy(900)}}
function finishBattle(win){if(!battle?.active)return;battle.active=false;stopTimers();let wild=battle.wild;if(win){if(!wild){save.wins++;save.coins+=12+save.gym*8;save.balls+=1;save.stage++;if(save.stage===7){save.medals.push(save.gym);save.coins+=100;save.balls+=3;save.potions+=2;save.gym++;save.stage=0}}else{save.coins+=4;}let xp=wild?18:22+save.gym*12+(save.stage===0?20:0);let evs=[];for(let m of save.team){if(m.hp<=0)continue;evs.push(...awardXP(m,xp));m.hp=Math.min(m.maxHp,m.hp+Math.ceil(m.maxHp*(wild?.12:.22)));}persist();resultScreen(wild?'⚔️ ENCONTRO VENCIDO!':save.stage===0?'🏅 INSÍGNIA CONQUISTADA!':'⭐ TREINADOR DERROTADO!',`+${xp} EXP para Pokémon ativos. +${wild?4:12+Math.max(0,save.gym-(save.stage===0?1:0))*8} moedas. ${evs.length?'Evolução: '+evs.join(', ')+'.':''}`,true,false)}else{save.losses++;save.coins=Math.max(0,save.coins-5);for(let m of save.team){m.hp=Math.max(1,Math.ceil(m.maxHp*.5));}persist();resultScreen('💔 VOCÊ PERDEU','Sua equipe foi recuperada parcialmente. Treine na grama, reorganize os Pokémon e tente novamente.',false,false)}}
function awardXP(m,amount){let events=[];m.xp+=amount;let cap=GYMS[Math.min(7,save.gym)].levelCap;while(m.level<cap && m.xp>=xpNeed(m.level)){m.xp-=xpNeed(m.level);m.level++;let oldMax=m.maxHp,info=D[m.id];m.maxHp=Math.round(info.hp*2*m.level/100+m.level+16);m.hp+=m.maxHp-oldMax;if(info.evolve&&m.level>=info.at){let before=info.name;m.id=info.evolve;info=D[m.id];m.maxHp=Math.round(info.hp*2*m.level/100+m.level+16);m.hp=m.maxHp;events.push(before+' → '+info.name)}else events.push(info.name+' Nv. '+m.level)}return events}
function xpNeed(level){return Math.round(13+level*2.3)}
function resultScreen(title,text,win,caught){battle=null;overlay(`<div class="result">${title}</div><p class="desc" style="text-align:center">${text}</p><div class="captureVisual">${win?'🏅':'🔴'}✨</div><div class="actionRow"><button class="btn primary wide" id="nextStage">${save.gym===8?'🏆 VER CONQUISTAS':'▶ CONTINUAR TORRE'}</button></div><p class="loading" style="text-align:center">Progresso salvo automaticamente neste navegador.</p>`);$('nextStage').onclick=()=>{close();render()};}
window.addEventListener('keydown',e=>{if(!battle?.active)return;let n=+e.key;if(n>=1&&n<=4)useSkill(n-1)});setInterval(()=>{if(!battle?.active)return;battle.energy=clamp(battle.energy+1.3,0,100);if(document.getElementById('skillbtn'))return;let root=document.querySelector('#combatContainer .skillgrid');if(root){root.querySelectorAll('button').forEach((button,i)=>{let skill=skillSet(current())[i];button.disabled=cooldowns[i]>Date.now()||battle.energy<skill.cost;});let bar=document.querySelector('.energyrow .progress i');if(bar)bar.style.width=battle.energy+'%';let t=document.querySelector('.energyrow span');if(t)t.textContent=`⚡ ENERGIA ${Math.round(battle.energy)}/100`}},175);
render();
})();</script></body></html>
