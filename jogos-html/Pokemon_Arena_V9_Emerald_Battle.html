/* V8 — Battle-first visual refresh */
:root{--mint:#79ffca;--blue:#8fdcff}
html,body{background:radial-gradient(ellipse at 15% 0%,#153952,#08111f 54%,#070e19);}
.panel{border-color:#3a6476;box-shadow:0 18px 55px #0007}
.gymHero{background:radial-gradient(circle at 80% 12%,var(--accent,#466d79) 0%,transparent 49%),linear-gradient(135deg,#24445a,#10283b);}

.hudPro{position:absolute;top:12px;z-index:4;max-width:44%;width:min(235px,43%);border:1px solid #b1dbde7a;border-radius:11px;padding:9px 10px;background:linear-gradient(125deg,#061622ed,#17304add);backdrop-filter:blur(6px);box-shadow:0 7px 16px #0006}
.hudPro.ally{left:11px}.hudPro.enemy{right:11px;text-align:right}
.hudName{font-weight:950;font-size:clamp(10px,2.8vw,15px);display:flex;justify-content:space-between;gap:5px;color:#fff}.hudPro.enemy .hudName{justify-content:flex-end;gap:9px}
.hudName em{font-size:10px;font-style:normal;color:#bcd9e5;white-space:nowrap}
.hudTrack{height:10px;border-radius:20px;overflow:hidden;background:#060e1d;border:1px solid #6a8da0;margin:7px 0 3px}
.hudTrack>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#2de6a1,#b0ffb7);transition:width .17s linear}
.hudNumbers{font-size:10px;color:#dcf8f1;font-weight:750}
.arenaChip{position:absolute;top:86px;left:12px;z-index:2;color:#c0ecdd;background:#102c36b5;padding:5px 9px;border-radius:20px;font-weight:850;font-size:10px;letter-spacing:.04em;pointer-events:none}
.crosshairHelp{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:.1em;color:#d6f4f5aa;white-space:nowrap;pointer-events:none;max-width:47%;overflow:hidden;text-overflow:ellipsis;text-align:center}

.battleFooter{margin-top:7px}

.energyHud span{white-space:nowrap}.energyHud #guardStatus{color:#c7d6e7;font-size:9px;text-align:right}
.energyTrack{flex:1;height:9px;background:#071324;border:1px solid #407b84;border-radius:50px;overflow:hidden}
.energyTrack i{height:100%;display:block;background:linear-gradient(90deg,#59d2ef,#96ffe1);border-radius:50px;transition:width .12s linear}
.skillgridV8{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:6px 0 7px}

.skillV8:disabled{opacity:.88;color:#d9e0e7}.skillV8:active:not(:disabled){transform:translateY(2px)}
.skillIcon{display:grid;place-items:center;width:36px;min-width:36px;height:36px;background:radial-gradient(circle at 25% 20%,#ffffff36,#15273b70);border-radius:9px;color:var(--skillColor);font-size:24px;filter:drop-shadow(0 0 7px var(--skillColor))}
.skillName{font-size:clamp(11px,2.5vw,13px);font-weight:950;line-height:1.25;z-index:1;overflow:hidden;text-overflow:ellipsis}
.skillName small{display:block;font-size:10px;font-weight:700;color:#b0cfda;margin-top:4px}
.coolMask{position:absolute;inset:auto 0 0 0;height:0;background:#020712a8;pointer-events:none;z-index:2}
.coolText{position:absolute;inset:0;display:grid;place-items:center;font-weight:1000;font-size:21px;text-shadow:0 2px 10px #000;z-index:3;pointer-events:none;color:#f0fffc}
.battleActions{display:flex;gap:6px;flex-wrap:wrap}
.miniBtn{border:1px solid #4b718c;background:linear-gradient(145deg,#19364b,#112439);border-radius:9px;padding:9px 10px;font-weight:800;font-size:11px;flex:1;min-width:75px}

.battleMessage{padding:8px 12px;min-height:31px;background:#0d2030;border:1px solid #385a77;border-radius:9px;color:#d7f9f0;font-size:12px;font-weight:720;margin-top:7px}
.keyHelp{font-size:10px;text-align:center;color:#83a2b5;padding:4px 0 1px}
.swapSheet{position:absolute;inset:0;background:#081726ef;z-index:10;overflow-y:auto;padding:15px;backdrop-filter:blur(9px)}
.swapSheet .swapgrid{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px}
.swapSheet .swapgrid button{padding:7px;background:#162a3f}

.swapHeading{display:flex;align-items:center;justify-content:space-between}
@media(max-width:700px){.modal.combatModal{padding:7px;border-radius:10px}.battleHeading{padding:5px 3px}.battleHeading h2{font-size:15px}.battleHeading .overline{font-size:8px}.liveFlag{font-size:8px;padding:5px}.arenaPro{height:clamp(232px,35dvh,335px);border-radius:11px}.arenaChip{top:81px;font-size:9px}.hudPro{top:7px;padding:7px;width:45%;max-width:45%}.hudPro.ally{left:6px}.hudPro.enemy{right:6px}.hudName{font-size:10px}.hudName em{font-size:9px}.hudNumbers{font-size:9px}.hudTrack{height:8px}.dodgeBtn{width:68px;height:68px;right:8px;bottom:11px;font-size:24px}.dodgeBtn small{font-size:8px}.joyZone{width:92px;height:92px;bottom:6px;left:5px}.joyBase{width:74px;height:74px}.joyKnob{width:35px;height:35px}.crosshairHelp{bottom:6px;font-size:7px}.energyHud{font-size:9px;gap:5px}.energyHud #guardStatus{font-size:8px}.skillV8{min-height:60px;padding:7px;gap:6px}.skillIcon{min-width:31px;width:31px;height:32px;font-size:21px}.skillName{font-size:11px}.skillName small{font-size:9px}.battleActions{gap:4px}.miniBtn{font-size:10px;padding:8px 5px}.battleMessage{font-size:11px;margin-top:5px}.keyHelp{display:none}}
@media(max-height:690px) and (max-width:700px){.arenaPro{height:228px}.battleHeading h2{margin:2px 0}.skillV8{min-height:52px}.battleMessage{font-size:10px}}
@media(prefers-reduced-motion:reduce){.arenaTint,.joyKnob{transition:none}}

.modalBackdrop:has(.combatModal){backdrop-filter:none}

function damage(attacker,defender,type,power){let a=D[attacker.id],d=D[defender.id],mult=advantage(type||'normal',d),stab=(type===a.type||type===a.type2)?1.35:1;let ratio=(a.atk+attacker.level*1.1+25)/(d.def+defender.level*.9+25);let raw=(power/12+attacker.level*.44+2)*ratio*stab*mult*(.88+Math.random()*.23);return {hit:Math.max(0,Math.round(raw)),mult}}

 for(const number of this.damageLabels){c.save();c.textAlign='center';c.font=`900 ${Math.max(17,Math.round(h*.067))}px system-ui`;c.shadowColor='#060a14';c.shadowBlur=5;c.lineWidth=4;c.strokeStyle='#14191c';c.strokeText(number.text,number.x,number.y);c.fillStyle=number.color;c.fillText(number.text,number.x,number.y);c.restore()}
 if(this.aim.x!==null&&now<this.aim.until){c.strokeStyle='#edffff8f';c.lineWidth=2;c.beginPath();c.arc(this.aim.x,this.aim.y,12,0,Math.PI*2);c.moveTo(this.aim.x-20,this.aim.y);c.lineTo(this.aim.x-8,this.aim.y);c.moveTo(this.aim.x+8,this.aim.y);c.lineTo(this.aim.x+20,this.aim.y);c.moveTo(this.aim.x,this.aim.y-20);c.lineTo(this.aim.x,this.aim.y-8);c.moveTo(this.aim.x,this.aim.y+8);c.lineTo(this.aim.x,this.aim.y+20);c.stroke()}
 c.restore();}
 drawMon(e,id,enemy,now){let c=this.ctx,entry=this.assets.get(id),r=this.h*(enemy?.14:.15),float=Math.sin(this.time*5+(enemy?1:0))*2.0;const s=this.h/300;
  c.save();c.globalAlpha=e.inv>0&&Math.floor(this.time*25)%2===0?.55:1;
  // Contact shadows keep sprites anchored to the ground, as in Pokémon Emerald Arena.
  c.fillStyle='#11131db3';c.beginPath();c.ellipse(e.x,e.y+r*.50,r*.68,r*.19,0,0,7);c.fill();
  if(e.guard>0){c.strokeStyle='#a5f7ffe3';c.shadowColor='#72dcff';c.shadowBlur=20;c.lineWidth=3;c.beginPath();c.arc(e.x,e.y,r*.88,0,7);c.stroke()}
  const actTime=this.attackActs[enemy?'enemy':'player']||0;
  let action=actTime>this.time?'Attack':e.flash>0?'Hurt':enemy?'Idle':Math.hypot(this.input.dx,this.input.dy)>.1||this.keys.has('w')||this.keys.has('a')||this.keys.has('s')||this.keys.has('d')?'Walk':'Idle';
  let pic=entry?.sheets[action],md=entry?.meta[action];
  if((!pic?.complete||!pic.naturalWidth||!md?.width)){pic=entry?.sheets.Idle;md=entry?.meta.Idle}
  const original=entry?.art;
  if(pic?.complete&&pic.naturalWidth&&md?.width){
   let fw=md.width,fh=md.height,columns=Math.floor(pic.naturalWidth/fw),rows=Math.floor(pic.naturalHeight/fh);
   if(columns>0&&rows>0){let durations=md.durations||[6];let ticks=Math.floor((this.time*30+(enemy?10:0))%durations.reduce((a,b)=>a+b,0));let frame=0;for(const d of durations){if(ticks<d)break;ticks-=d;frame++}frame=Math.min(frame,columns-1);
    const angle=Math.atan2((enemy?this.player.y-e.y:this.enemy.y-e.y),(enemy?this.player.x-e.x:this.enemy.x-e.x));
    let row=((Math.round((angle+Math.PI/2)/(Math.PI/4))%8)+8)%8;row%=rows;
    const height=Math.min(130*s,Math.max(62*s,fh*2.65*s)),width=fw/fh*height;
    c.imageSmoothingEnabled=false;c.drawImage(pic,frame*fw,row*fh,fw,fh,e.x-width/2,e.y-height*.64+float,width,height);
    c.imageSmoothingEnabled=true;
   }
  }else if(original?.complete&&original.naturalWidth){
   let height=r*1.95,ww=height*(original.naturalWidth/original.naturalHeight);
   c.drawImage(original,e.x-ww/2,e.y-height*.75+float,ww,height);
  }else if(entry?.offline?.complete&&entry.offline.naturalWidth){
   let height=r*2.2;c.imageSmoothingEnabled=false;
   c.drawImage(entry.offline,e.x-height/2,e.y-height*.69+float,height,height);c.imageSmoothingEnabled=true;
  }else{
   c.fillStyle=enemy?'#78565f':'#528a88';c.beginPath();c.ellipse(e.x,e.y-12*s,r*.52,r*.59,0,0,7);c.fill();
   c.fillStyle='#edf8e5';c.font=`${Math.round(r*.45)}px system-ui`;c.textAlign='center';c.fillText(D[id]?.name||'?',e.x,e.y-r*.8);
  }
  if(e.flash>0){c.globalCompositeOperation='screen';c.globalAlpha=.6;c.fillStyle='#ffffff';c.beginPath();c.ellipse(e.x,e.y-r*.23,r*.64,r*.60,0,0,7);c.fill()}
  c.restore();}
 drawProjectile(a){const c=this.ctx,col=TYPE_COLOR[a.type]||'#ffdd91';c.save();c.strokeStyle=col;c.lineWidth=a.r*.75;c.lineCap='round';c.shadowColor=col;c.shadowBlur=11;c.globalAlpha=.75;c.beginPath();a.tail.forEach((p,i)=>i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y));c.stroke();c.globalAlpha=1;let rr=a.r*1.45;let grad=c.createRadialGradient(a.x,a.y,1,a.x,a.y,rr);grad.addColorStop(0,'#ffffff');grad.addColorStop(.22,col);grad.addColorStop(1,hexOpacity(col,0));c.fillStyle=grad;c.beginPath();c.arc(a.x,a.y,rr,0,Math.PI*2);c.fill();if(a.shape==='leaf'){c.fillStyle='#a9ff7e';c.translate(a.x,a.y);c.rotate(Math.atan2(a.vy,a.vx));c.beginPath();c.ellipse(0,0,a.r*1.6,a.r*.55,0,0,Math.PI*2);c.fill()}c.restore();}
 updateHud(now){if(!battle?.active)return;const p=current(),e=foe();for(const [who,m] of [['ally',p],['enemy',e]]){let bar=$(who+'HP'),label=$(who+'HpText');if(bar)bar.style.width=clamp(m.hp/m.maxHp*100,0,100)+'%';if(label)label.textContent=`${Math.ceil(m.hp)}/${m.maxHp} PV`;if(bar)bar.style.background=m.hp/m.maxHp<.24?'linear-gradient(90deg,#f2655f,#ffb46a)':'linear-gradient(90deg,#2de6a1,#b0ffb7)'}const en=$('energyNumber'),fill=$('energyFill'),g=$('guardStatus'),d=$('dodgeBtn');if(en)en.textContent=Math.round(battle.energy);if(fill)fill.style.width=battle.energy+'%';if(g)g.textContent=this.player.guard>0?'🛡 ESCUDO ATIVO':(this.aim.x!==null&&now<this.aim.until?'MIRA MANUAL':'MIRA AUTOMÁTICA');if(d){d.disabled=this.player.dodgeCd>0||battle.energy<12;d.querySelector('small').textContent=this.player.dodgeCd>0?this.player.dodgeCd.toFixed(1)+' s':'ESQUIVA'}const fps=$('fpsChip');if(fps)fps.textContent=`${this.fps} FPS · ${this.fps>=50?'FLUIDO':'AJUSTANDO'}`;let ss=skillSet(p);for(let i=0;i<4;i++){let b=document.querySelector(`[data-skill="${i}"]`),mask=$('coolMask'+i),ct=$('coolText'+i);if(!b||!mask||!ct)continue;let remain=Math.max(0,cooldowns[i]-now),pct=Math.min(100,remain/ss[i].cd*100);b.disabled=battle.energy<ss[i].cost||remain>0||battle.paused;mask.style.height=pct+'%';ct.textContent=remain>0?(remain/1000).toFixed(1)+'s':'';}}
}

function awardXP(m,amount){let events=[];m.xp+=amount;let cap=GYMS[Math.min(7,save.gym)].levelCap;while(m.level<cap && m.xp>=xpNeed(m.level)){m.xp-=xpNeed(m.level);m.level++;let oldMax=m.maxHp,info=D[m.id];m.maxHp=Math.round(info.hp*2*m.level/100+m.level+16);m.hp+=m.maxHp-oldMax;if(info.evolve&&m.level>=info.at){let before=info.name;m.id=info.evolve;info=D[m.id];m.maxHp=Math.round(info.hp*2*m.level/100+m.level+16);m.hp=m.maxHp;events.push(before+' → '+info.name)}else events.push(info.name+' Nv. '+m.level)}return events}
function xpNeed(level){return Math.round(13+level*2.3)}
