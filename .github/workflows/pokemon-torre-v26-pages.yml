name: Pokemon Torre V26 - GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "jogos-html/pokemon-torre-v26/**"
      - ".github/workflows/pokemon-torre-v26-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pokemon-torre-v26-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: jogos-html/pokemon-torre-v26
      - id: deployment
        uses: actions/deploy-pages@v4
