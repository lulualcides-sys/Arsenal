name: Pokemon Torre V34.7 - Sprites Kanto Pessoal
on:
  push:
    branches: [main]
    paths:
      - "jogos-html/pokemon-torre-v34-7/sprites_patch.js"
      - "jogos-html/pokemon-torre-v34-7/sprites_smoke.py"
      - ".github/workflows/pokemon-v34-7-sprites.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Montar jogo de teste sem alterar o Railway
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("jogos-html/pokemon-torre-v34-6/index.html").read_text(encoding="utf-8")
          patch=Path("jogos-html/pokemon-torre-v34-7/sprites_patch.js").read_text(encoding="utf-8")
          marker="/* FIM POKEMON TORRE V34.6 */"
          assert src.count(marker)==1,"V34.6 mudou"
          assert patch.count("/* FIM SPRITES V34.7 */")==1
          output=src.replace(marker,marker+"\n"+patch,1)
          target=Path("jogos-html/pokemon-torre-v34-7/index.html")
          target.write_text(output,encoding="utf-8")
          js=output.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/v347.js").write_text(js,encoding="utf-8")
          print("private build",len(output.encode("utf-8")),"bytes")
          PY
          node --check /tmp/v347.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Testar selecao automatica dos 151 sprites
        run: python jogos-html/pokemon-torre-v34-7/sprites_smoke.py
      - name: Gerar versao de uso pessoal sem deploy publico
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Torre-V34-7-Teste-Pessoal
          path: jogos-html/pokemon-torre-v34-7/index.html
          retention-days: 14
