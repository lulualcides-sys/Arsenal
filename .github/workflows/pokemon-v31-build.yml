name: Pokemon Torre V31 - Build 2D e verificacao
on:
  push:
    branches: [main]
    paths:
      - "jogos-html/pokemon-torre-v31/patch.js"
      - "jogos-html/pokemon-torre-v30-1/index.html"
      - ".github/workflows/pokemon-v31-build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar V31 e validar 10 atualizacoes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path("jogos-html/pokemon-torre-v30-1/index.html").read_text()
          patch=Path("jogos-html/pokemon-torre-v31/patch.js").read_text()
          marker="render();\n})();"
          assert base.count(marker)==1, "Fim do jogo alterado"
          checks=["PokemonTorreV31Diagnostics","V31_SIG","v31ShinyImage","v31Trainer","v31Duo","v31InventoryPanel","V31_HELD","v31Repeat","V31_ACH","v31Difficulty"]
          assert all(x in patch for x in checks), "V31 incompleta"
          assert "PokemonTorre301Diagnostics" in base
          out=base.replace(marker,patch+"\n"+marker)
          out=out.replace("<title>Pokémon Torre V30.1 — Kanto 2D</title>", "<title>Pokémon Torre V31 — Kanto 2D</title>")
          Path("jogos-html/pokemon-torre-v31/index.html").write_text(out)
          Path("/tmp/pokemon_torre_v31.js").write_text(out.split("<script>",1)[1].split("</script>",1)[0])
          print("V31 criada: ",len(out),"caracteres")
          PY
          node --check /tmp/pokemon_torre_v31.js
      - name: Salvar arquivo unificado na versao isolada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos-html/pokemon-torre-v31/index.html
          if ! git diff --cached --quiet; then
            git commit -m "build(pokemon): V31 standalone 2D HTML"
            git push
          fi
