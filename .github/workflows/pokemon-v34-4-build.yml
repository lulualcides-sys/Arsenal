name: Pokemon Torre V34.4 - Sprites Reais
on:
  push:
    branches: [main]
    paths:
      - "jogos-html/pokemon-torre-v34-4/patch.js"
      - "jogos-html/pokemon-torre-v34-4/sprites-data.js"
      - "jogos-html/pokemon-torre-v34-4/smoke_test.py"
      - ".github/workflows/pokemon-v34-4-build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Montar HTML de sprites reais
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          origin=Path("jogos-html/pokemon-torre-v34-3/index.html").read_text(encoding="utf-8")
          data=Path("jogos-html/pokemon-torre-v34-4/sprites-data.js").read_text(encoding="utf-8")
          patch=Path("jogos-html/pokemon-torre-v34-4/patch.js").read_text(encoding="utf-8")
          marker="/* FIM V34.3 GOLPES INDIVIDUAIS */"
          assert origin.count(marker)==1,"Local do motor mudou"
          assert data.count("data:image/png;base64,")==8,"Sprites ausentes"
          assert patch.count("/* FIM POKEMON TORRE V34.4 */")==1
          output=origin.replace(marker,marker+"\n"+data+"\n"+patch,1)
          assert output.count("PokemonTorreV344Diagnostics")==1
          target=Path("jogos-html/pokemon-torre-v34-4/index.html")
          target.write_text(output,encoding="utf-8")
          Path("/tmp/pokemon-v344.js").write_text(output.split("<script>",1)[1].split("</script>",1)[0],encoding="utf-8")
          print("V34.4 criado",len(output.encode('utf-8')),"bytes")
          PY
          node --check /tmp/pokemon-v344.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Chromium para testes
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Testar golpes, sprites e dupla no Android simulado
        run: python jogos-html/pokemon-torre-v34-4/smoke_test.py
      - name: Publicar HTML completo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos-html/pokemon-torre-v34-4/index.html
          if ! git diff --cached --quiet; then
            git commit -m "build(pokemon): HTML V34.4 com spritesheets reais"
            git push
          fi
